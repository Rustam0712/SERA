<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X-KEYSCORE OSINT Hub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f0f8ff;
      color: #001f3f;
      font-family: 'Courier New', monospace;
    }
    .container {
      max-width: 1100px;
    }
    h2, h5 {
      color: #003366;
      text-shadow: 0 0 2px #b0c4de;
    }
    .form-label {
      color: #003366;
      font-weight: bold;
    }
    .form-control, .form-select {
      background-color: #e6f2ff;
      border: 1px solid #003366;
      color: #001f3f;
    }
    .btn-primary {
      background-color: #003366;
      border: none;
    }
    .btn-primary:hover {
      background-color: #001f3f;
    }
    .section-title {
      background-color: #003366;
      color: white;
      padding: 8px;
      margin-top: 30px;
      border-radius: 6px;
    }
    .result-section {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 10px;
      padding-top: 20px;
    }
    .result-card {
      border: 1px solid #003366;
      background-color: #ffffff;
      color: #001f3f;
      border-radius: 6px;
      padding: 10px;
    }
    .result-card a {
      color: #003366;
    }
  </style>
</head>

<body>
  <div class="container py-5">
    <h2 class="text-center mb-4">🛰 ANDROMEDA OSINT Intelligence Panel</h2>

    <div class="mb-4">
      <label class="form-label">Выберите тип поиска:</label>
      <select class="form-select" id="searchType">
        <option value="">-- Выберите --</option>
        <option value="person">🔍 Поиск человека</option>
        <option value="account">🔐 Поиск аккаунта</option>
        <option value="event">📅 Поиск события</option>
        <option value="news">🗞 Поиск новости</option>
        <option value="data">🗄 Поиск данных</option>
        <option value="iplookup">🌐 Пробив по IP</option>
      </select>
    </div>

    <form id="searchForm"></form>

    <hr class="my-4">
    <div id="results"></div>
  </div>

  <script>
    const templates = {
      person: [
        'site:facebook.com "{query}"',
        'site:vk.com "{query}"',
        'site:ok.ru "{query}"',
        'site:t.me "{query}"',
        'site:linkedin.com/in "{query}"',
        '"{query}" site:youla.ru',
        '"{query}" site:avito.ru'
      ],
      account: [
        'site:instagram.com "{query}"',
        'site:snapchat.com "{query}"',
        'site:twitter.com "{query}"',
        'site:github.com "{query}"'
      ],
      event: [
        '"{query}" site:eventbrite.com',
        '"{query}" site:meetup.com',
        '"{query}" intitle:event'
      ],
      news: [
        '"{query}" site:bbc.com',
        '"{query}" site:cnn.com',
        '"{query}" site:ria.ru',
        '"{query}" site:tass.ru'
      ],
      data: [
        'intext:"{query}" filetype:txt',
        'filetype:pdf "{query}"',
        'filetype:xls "{query}"',
        'site:pastebin.com "{query}"'
      ],
      iplookup: []
    };

    const inputFields = {
      person: ["fullname", "location", "birth", "passport"],
      account: ["username", "telegram", "email"],
      event: ["fullname", "location"],
      news: ["fullname", "location"],
      data: ["email", "phone", "ip"],
      iplookup: ["ip"]
    };

    document.getElementById('searchType').addEventListener('change', function () {
      const selected = this.value;
      const form = document.getElementById('searchForm');
      form.innerHTML = '';

      if (selected && inputFields[selected]) {
        inputFields[selected].forEach(field => {
          const label = document.createElement('label');
          label.className = 'form-label mt-2';
          label.textContent = field.toUpperCase();
          const input = document.createElement('input');
          input.className = 'form-control';
          input.id = field;
          input.placeholder = `Введите ${field}`;
          form.appendChild(label);
          form.appendChild(input);
        });
        const btn = document.createElement('button');
        btn.className = 'btn btn-primary mt-4 w-100';
        btn.textContent = '🚀 Начать поиск';
        btn.type = 'submit';
        form.appendChild(btn);
      }
    });

    document.getElementById('searchForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const selected = document.getElementById('searchType').value;
      const fields = inputFields[selected] || [];
      const queries = [];
      fields.forEach(field => {
        const val = document.getElementById(field)?.value.trim();
        if (val) queries.push(val);
      });

      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = `<div class="section-title">🔗 Результаты по запросу (${selected})</div><div class="result-section">`;

      if (selected === 'iplookup') {
        queries.forEach(ip => {
          const apiLink = `https://2ip.kz/ipinfo/${ip}`;
          resultsDiv.innerHTML += `
            <div class="result-card">
              <strong>IP Lookup: ${ip}</strong><br>
              <a href="${apiLink}" target="_blank">Посмотреть данные на 2ip.kz</a>
            </div>
          `;
        });
      } else {
        queries.forEach(query => {
          templates[selected].forEach(temp => {
            const finalQuery = temp.replaceAll('{query}', query);
            const link = 'https://www.google.com/search?q=' + encodeURIComponent(finalQuery);
            resultsDiv.innerHTML += `
              <div class="result-card">
                <strong>${temp.replace('{query}', query)}</strong><br>
                <a href="${link}" target="_blank">Открыть в Google</a>
              </div>
            `;
          });
        });
      }

      resultsDiv.innerHTML += '</div>';
    });
  </script>
</body>

</html>
